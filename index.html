<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دنیای پریسا 🤍</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            font-family: Vazirmatn, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffd6e7, #fff7fb);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 20px 0;
        }

        .heart {
            position: fixed;
            opacity: .35;
            animation: floatHeart 10s linear infinite;
            pointer-events: none;
        }

        .heart:nth-child(1) {
            left: 10%;
        }
        .heart:nth-child(2) {
            left: 30%;
            animation-delay: 2s;
        }
        .heart:nth-child(3) {
            left: 70%;
            animation-delay: 5s;
        }
        .heart:nth-child(4) {
            left: 90%;
            animation-delay: 1s;
        }
        .heart:nth-child(5) {
            left: 50%;
            animation-delay: 7s;
            font-size: 20px;
        }

        @keyframes floatHeart {
            from {
                transform: translateY(100vh);
            }
            to {
                transform: translateY(-20vh);
            }
        }

        .container {
            width: 94%;
            max-width: 900px;
            text-align: center;
        }

        .logo {
            font-size: 72px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.15);
            }
        }

        .glass {
            background: rgba(255, 255, 255, .55);
            backdrop-filter: blur(12px);
            padding: 18px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
            margin: 18px 0;
        }

        button {
            border: none;
            background: #b03060;
            color: #fff;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(176, 48, 96, .4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .welcome {
            animation: show 1.5s;
        }

        .welcome h2 {
            color: #b03060;
            font-size: 28px;
        }

        .welcome p {
            color: #555;
            line-height: 2;
        }

        .menu {
            display: none;
            animation: show 1s;
        }

        .menu h1 {
            color: #b03060;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .menu .sub-title {
            color: #888;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 20px;
            align-items: start;
        }

        .menu-grid .left-col {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-grid .right-col {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .period-card {
            background: linear-gradient(145deg, rgba(255, 245, 247, 0.9), rgba(255, 232, 238, 0.75));
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 22px 20px 20px;
            border: 1px solid rgba(255, 182, 193, 0.3);
            box-shadow: 0 12px 35px rgba(176, 48, 96, 0.12);
            position: relative;
            overflow: hidden;
            text-align: center;
            width: 100%;
            margin-top: 20px;
        }

        .period-card::before {
            content: '🌸';
            position: absolute;
            top: -15px;
            left: -10px;
            font-size: 65px;
            opacity: 0.12;
            transform: rotate(-15deg);
        }

        .period-card::after {
            content: '🌙';
            position: absolute;
            bottom: -15px;
            right: -10px;
            font-size: 55px;
            opacity: 0.12;
            transform: rotate(15deg);
        }

        .period-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .period-card .card-header .title {
            font-size: 16px;
            font-weight: 700;
            color: #b03060;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .period-card .card-header .title .icon {
            font-size: 20px;
        }

        .period-card .card-header .settings-btn {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 182, 193, 0.3);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b03060;
            padding: 0;
        }

        .period-card .card-header .settings-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: rotate(60deg);
            box-shadow: 0 4px 15px rgba(176, 48, 96, 0.2);
        }

        .period-card .main-display {
            position: relative;
            z-index: 1;
            padding: 3px 0;
        }

        .period-card .days-number {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #b03060, #d44a7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            letter-spacing: -2px;
        }

        .period-card .days-label {
            font-size: 15px;
            color: #b03060;
            font-weight: 600;
            margin-top: 4px;
            -webkit-text-fill-color: #b03060;
        }

        .period-card .days-label .highlight {
            color: #d44a7a;
            font-weight: 700;
        }

        .period-card .period-stats {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin: 10px 0 6px;
            position: relative;
            z-index: 1;
        }

        .period-card .period-stats .stat-item {
            text-align: center;
            font-size: 13px;
            color: #888;
        }

        .period-card .period-stats .stat-item .stat-number {
            display: block;
            font-size: 20px;
            font-weight: 700;
            color: #b03060;
            -webkit-text-fill-color: #b03060;
        }

        .period-card .period-stats .stat-divider {
            width: 1px;
            background: rgba(176, 48, 96, 0.15);
        }

        .period-card .motivation-text {
            font-size: 14px;
            color: #c94f7a;
            font-weight: 500;
            margin-top: 10px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 182, 193, 0.2);
            -webkit-text-fill-color: #c94f7a;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .period-card .motivation-text .emoji {
            font-size: 16px;
            -webkit-text-fill-color: initial;
        }

        .period-card .more-info-btn {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 182, 193, 0.2);
            border-radius: 14px;
            padding: 7px 16px;
            font-size: 12px;
            color: #b03060;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            font-family: Vazirmatn, sans-serif;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .period-card .more-info-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(1.03);
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            text-decoration: none;
            color: #444;
            background: rgba(255, 255, 255, .55);
            padding: 20px 8px;
            border-radius: 22px;
            font-size: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .06);
            transition: .3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0, 0, 0, .12);
        }

        .card span {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: #888;
        }

        #counter {
            line-height: 2;
            color: #b03060;
        }

        footer {
            margin-top: 30px;
            color: #888;
            font-size: 14px;
            grid-column: 1 / -1;
            text-align: center;
        }

        @keyframes show {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* مودال تنظیمات */
        .period-settings-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
            padding: 20px;
        }

        .period-settings-overlay.active {
            display: flex;
        }

        .period-settings-modal {
            background: white;
            padding: 30px 25px 28px;
            border-radius: 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
            animation: modalPop 0.4s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .period-settings-modal h4 {
            color: #b03060;
            font-size: 20px;
            margin-bottom: 4px;
        }

        .period-settings-modal p {
            color: #888;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .period-settings-modal .date-input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: right;
        }

        .period-settings-modal .date-input-group label {
            font-size: 13px;
            color: #555;
            font-weight: 600;
        }

        .period-settings-modal .date-input-group input[type="date"] {
            padding: 10px 14px;
            border: 2px solid #f0c4ce;
            border-radius: 14px;
            font-size: 15px;
            font-family: Vazirmatn, sans-serif;
            background: rgba(255, 255, 255, 0.8);
            transition: 0.3s;
            width: 100%;
            text-align: center;
            color: #555;
        }

        .period-settings-modal .date-input-group input[type="date"]:focus {
            border-color: #b03060;
            outline: none;
            box-shadow: 0 0 0 3px rgba(176, 48, 96, 0.12);
        }

        .period-settings-modal .settings-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .period-settings-modal .settings-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: Vazirmatn, sans-serif;
        }

        .period-settings-modal .btn-save {
            background: linear-gradient(135deg, #b03060, #d44a7a);
            color: #fff;
            box-shadow: 0 4px 15px rgba(176, 48, 96, 0.25);
        }

        .period-settings-modal .btn-save:hover {
            transform: scale(1.03);
        }

        .period-settings-modal .btn-close-settings {
            background: #f0f0f0;
            color: #888;
        }

        .period-settings-modal .btn-close-settings:hover {
            background: #e5e5e5;
        }

        .period-settings-modal .history-list {
            margin-top: 12px;
            text-align: right;
            border-top: 1px solid #f0c4ce;
            padding-top: 12px;
        }

        .period-settings-modal .history-list .history-title {
            font-size: 13px;
            color: #888;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .period-settings-modal .history-list .history-title .count {
            color: #b03060;
            font-weight: 700;
        }

        .period-settings-modal .history-list .history-item {
            font-size: 13px;
            color: #555;
            padding: 6px 0;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .period-settings-modal .history-list .history-item .date {
            color: #b03060;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .period-settings-modal .history-list .history-item .date:hover {
            color: #d44a7a;
            transform: scale(1.02);
        }

        .period-settings-modal .history-list .history-item .actions {
            display: flex;
            gap: 8px;
        }

        .period-settings-modal .history-list .history-item .actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 6px;
            transition: 0.2s;
            font-family: Vazirmatn, sans-serif;
            width: auto;
            box-shadow: none;
        }

        .period-settings-modal .history-list .history-item .actions .edit-btn {
            color: #3498db;
        }

        .period-settings-modal .history-list .history-item .actions .edit-btn:hover {
            background: rgba(52, 152, 219, 0.1);
            transform: scale(1.1);
        }

        .period-settings-modal .history-list .history-item .actions .delete-btn {
            color: #e74c3c;
        }

        .period-settings-modal .history-list .history-item .actions .delete-btn:hover {
            background: rgba(231, 76, 60, 0.1);
            transform: scale(1.1);
        }

        .period-settings-modal .cycle-info {
            margin-top: 12px;
            padding: 12px;
            background: rgba(255, 245, 247, 0.5);
            border-radius: 14px;
            border: 1px solid rgba(255, 182, 193, 0.2);
            text-align: center;
        }

        .period-settings-modal .cycle-info .label {
            font-size: 12px;
            color: #888;
        }

        .period-settings-modal .cycle-info .value {
            font-size: 18px;
            font-weight: 700;
            color: #b03060;
            margin-top: 2px;
        }

        .period-info-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            z-index: 2001;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
            padding: 20px;
        }

        .period-info-overlay.active {
            display: flex;
        }

        .period-info-modal {
            background: white;
            padding: 30px 25px 28px;
            border-radius: 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
            animation: modalPop 0.4s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .period-info-modal h4 {
            color: #b03060;
            font-size: 20px;
            margin-bottom: 4px;
        }

        .period-info-modal .info-item {
            text-align: right;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .period-info-modal .info-item .label {
            font-size: 13px;
            color: #888;
            font-weight: 600;
        }

        .period-info-modal .info-item .value {
            font-size: 15px;
            color: #b03060;
            font-weight: 700;
            margin-top: 2px;
        }

        .period-info-modal .close-info-btn {
            margin-top: 15px;
            padding: 10px 30px;
            background: #b03060;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: Vazirmatn, sans-serif;
            transition: 0.3s;
        }

        .period-info-modal .close-info-btn:hover {
            transform: scale(1.03);
        }

        /* مودال رمز */
        .password-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(176, 48, 96, 0.4);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.4s;
            padding: 20px;
        }

        .password-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .password-modal {
            background: linear-gradient(145deg, #fff5f7, #ffe8ee);
            padding: 40px 30px 35px;
            border-radius: 35px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 40px 100px rgba(176, 48, 96, 0.35), 0 0 0 2px rgba(255, 182, 193, 0.3);
            animation: modalPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .password-modal::before {
            content: '🌸';
            position: absolute;
            top: -15px;
            right: -15px;
            font-size: 70px;
            opacity: 0.15;
            transform: rotate(25deg);
        }

        .password-modal::after {
            content: '🌸';
            position: absolute;
            bottom: -15px;
            left: -15px;
            font-size: 70px;
            opacity: 0.15;
            transform: rotate(-25deg);
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.85) translateY(40px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .password-modal .modal-logo {
            font-size: 55px;
            display: block;
            margin-bottom: 6px;
            animation: heartBeat 1.8s infinite;
        }

        @keyframes heartBeat {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.12);
            }
        }

        .password-modal h3 {
            color: #b03060;
            font-size: 24px;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .password-modal .sub-text {
            color: #c94f7a;
            font-size: 14px;
            margin-bottom: 18px;
            opacity: 0.8;
        }

        .password-modal .love-words {
            min-height: 80px;
            padding: 18px 18px;
            margin-bottom: 18px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.7), rgba(255, 240, 245, 0.5));
            border-radius: 20px;
            border: 1px solid rgba(255, 182, 193, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .password-modal .love-words::before {
            content: '“';
            position: absolute;
            top: 5px;
            right: 12px;
            font-size: 28px;
            color: #d4a0b0;
            opacity: 0.4;
            font-family: serif;
        }

        .password-modal .love-words::after {
            content: '”';
            position: absolute;
            bottom: 0px;
            left: 12px;
            font-size: 28px;
            color: #d4a0b0;
            opacity: 0.4;
            font-family: serif;
        }

        .password-modal .love-words .sentence {
            font-size: 22px;
            color: #b03060;
            font-weight: 700;
            animation: wordPop 0.7s ease;
            line-height: 1.8;
            padding: 0 15px;
            background: linear-gradient(135deg, #b03060, #d44a7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes wordPop {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .password-modal input {
            width: 100%;
            padding: 14px;
            border: 2px solid #f0c4ce;
            border-radius: 18px;
            font-size: 24px;
            text-align: center;
            direction: ltr;
            transition: 0.3s;
            letter-spacing: 10px;
            background: rgba(255, 255, 255, 0.8);
            color: #b03060;
            font-weight: bold;
        }

        .password-modal input:focus {
            border-color: #b03060;
            outline: none;
            box-shadow: 0 0 0 4px rgba(176, 48, 96, 0.12);
            background: white;
        }

        .password-modal input.error {
            border-color: #e74c3c;
            animation: shake 0.5s;
        }

        .password-modal input.success {
            border-color: #27ae60;
            background: #f0fff4;
        }

        .password-modal input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .password-modal .modal-error {
            color: #e74c3c;
            font-size: 14px;
            min-height: 26px;
            margin-top: 10px;
            font-weight: 500;
        }

        .password-modal .modal-error.success-text {
            color: #27ae60;
        }

        .password-modal .modal-error.locked {
            color: #e67e22;
            font-size: 15px;
        }

        .password-modal .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .password-modal .modal-buttons button {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 18px;
            font-size: 15px;
            cursor: pointer;
            transition: .3s;
            font-weight: 700;
        }

        .password-modal .btn-confirm {
            background: linear-gradient(135deg, #b03060, #d44a7a);
            color: #fff;
            box-shadow: 0 6px 25px rgba(176, 48, 96, 0.3);
        }

        .password-modal .btn-confirm:hover:not(:disabled) {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(176, 48, 96, 0.4);
        }

        .password-modal .btn-confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .password-modal .btn-cancel {
            background: rgba(255, 255, 255, 0.8);
            color: #888;
            border: 1px solid #f0c4ce;
        }

        .password-modal .btn-cancel:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.95);
        }

        .password-modal .btn-cancel:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal-hearts {
            position: absolute;
            font-size: 20px;
            opacity: 0.25;
            animation: floatModalHeart 6s infinite;
        }

        .modal-hearts:nth-child(1) {
            top: 10px;
            left: 15px;
            animation-delay: 0s;
        }
        .modal-hearts:nth-child(2) {
            bottom: 10px;
            right: 15px;
            animation-delay: 2s;
        }
        .modal-hearts:nth-child(3) {
            top: 50%;
            left: 6px;
            animation-delay: 4s;
            font-size: 14px;
        }
        .modal-hearts:nth-child(4) {
            top: 50%;
            right: 6px;
            animation-delay: 1s;
            font-size: 14px;
        }

        @keyframes floatModalHeart {
            0%,
            100% {
                transform: translateY(0) rotate(0);
            }
            50% {
                transform: translateY(-10px) rotate(10deg);
            }
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }

        .attempts-left {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }

        .attempts-left span {
            color: #b03060;
            font-weight: bold;
            font-size: 15px;
        }

        @media (max-width: 768px) {

                gap: 15px;

            .menu-grid .left-col,
            .menu-grid .right-col {
                gap: 15px;
            }

            .period-card {

                margin-top: 0;
            }

            .period-card .days-number {
                font-size: 40px;
            }

            .cards {
                gap: 10px;
            }

            .card {
                padding: 15px 6px;
                font-size: 26px;
                min-height: 70px;
            }

            .card span {
                font-size: 11px;
            }

            .password-modal {
                padding: 30px 20px 25px;
            }

            .password-modal .love-words .sentence {
                font-size: 18px;
            }

            .container {
                width: 96%;
            }
        }

        @media (max-width: 480px) {
            .period-card .days-number {
                font-size: 34px;
            }

            .period-card .period-stats .stat-item {
                font-size: 11px;
            }

            .period-card .period-stats .stat-item .stat-number {

            }

            .cards {
                gap: 8px;
            }

            .card {
                padding: 12px 4px;
                font-size: 22px;
                min-height: 60px;
            }

            .card span {
                font-size: 10px;
            }
        }
    </style>
</head>
