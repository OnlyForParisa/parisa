<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دنیای پریسا 🤍</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');


*{
    box-sizing:border-box;
    font-family:Vazirmatn,sans-serif;
}


body{

    margin:0;
    min-height:100vh;

    background:
    linear-gradient(135deg,#ffd6e7,#fff7fb);

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

}


/* قلب های پس زمینه */

.heart{

    position:absolute;
    font-size:20px;
    opacity:.4;

    animation:float 10s linear infinite;

}


@keyframes float{

    from{
        transform:translateY(100vh);
    }

    to{
        transform:translateY(-20vh);
    }

}




.container{

    width:90%;
    max-width:500px;

    text-align:center;

    z-index:2;

}



.welcome{

    animation:show 1.5s;

}


.logo{

    font-size:80px;

    animation:pulse 2s infinite;

}


h1{

    color:#b03060;
    font-size:30px;

}


p{

    color:#555;

    line-height:2;

}



button{

    margin-top:30px;

    border:none;

    padding:15px 35px;

    border-radius:40px;

    background:#b03060;

    color:white;

    font-size:18px;

    cursor:pointer;

}



.menu{

    display:none;

    animation:show 1s;

}



.cards{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;

    margin-top:30px;

}



.card{

    text-decoration:none;

    color:#444;

    background:rgba(255,255,255,.55);

    padding:25px 10px;

    border-radius:25px;

    font-size:35px;

    backdrop-filter:blur(10px);

    box-shadow:0 10px 25px rgba(0,0,0,.08);

    transition:.3s;

}


.card:hover{

    transform:translateY(-8px) scale(1.03);

}



.card span{

    display:block;

    font-size:15px;

    margin-top:10px;

}



footer{

    margin-top:35px;

    color:#888;

}



@keyframes pulse{

    50%{
        transform:scale(1.15);
    }

}



@keyframes show{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


</style>

</head>



<body>


<!-- چند قلب متحرک -->

<div class="heart" style="left:10%;animation-delay:0s">🤍</div>
<div class="heart" style="left:30%;animation-delay:3s">♡</div>
<div class="heart" style="left:70%;animation-delay:5s">🤍</div>
<div class="heart" style="left:90%;animation-delay:2s">♡</div>



<div class="container">


<div class="welcome" id="welcome">

<div class="logo">
🤍
</div>


<h1>
سلام پریسا...
</h1>


<p>
این فقط یک سایت نیست؛
<br>
یه ایده کوچیکه که با فکر تو ساخته شده ✨
</p>


<button onclick="enter()">
ورود به دنیای ما 🤍
</button>


</div>




<div class="menu" id="menu">


<h1>
دنیای پریسا ✨
</h1>


<p>
هر قسمت یه داستان کوچیک داره...
</p>



<div class="cards">


<a class="card" href="#">
💌
<span>نامه‌ها</span>
</a>


<a class="card" href="surprises.html">
🎁
<span>سوپرایزها</span>
</a>


<a class="card" href="#">
📸
<span>خاطرات</span>
</a>


<a class="card" href="#">
🧠
<span>بازی و تست‌ها</span>
</a>


<a class="card" href="#">
🎉
<span>تبریکات</span>
</a>


<a class="card" href="#">
🔒
<span>اتاق مخفی</span>
</a>


</div>



<footer>
ساخته شده با عشق 🤍
</footer>


</div>



</div>



<script>

function enter(){

document.getElementById("welcome").style.display="none";

document.getElementById("menu").style.display="block";

}

</script>



</body>

</html>
