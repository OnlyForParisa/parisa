<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 اتاق مخفی</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    
    <!-- ===== بارگذاری config.js ===== -->
    <script src="../config.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            font-family: Vazirmatn, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0d0820);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* ستاره‌ها */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            color: #fff;
            font-size: 12px;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: .2; transform: scale(.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .heart-float {
            position: fixed;
            opacity: .06;
            font-size: 30px;
            animation: floatUp 20s linear infinite;
            pointer-events: none;
            z-index: 0;
            color: #ff6b9d;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg) scale(.5); opacity: 0; }
            10% { opacity: .06; }
            90% { opacity: .06; }
            100% { transform: translateY(-20vh) rotate(720deg) scale(1.5); opacity: 0; }
        }

        .container {
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* ===== هدر ===== */
        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeDown 1s;
        }
        .header .icon {
            font-size: 70px;
            display: block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }
        .header h1 {
            color: #64c8ff;
            font-size: 32px;
            margin: 10px 0 5px;
            text-shadow: 0 0 30px rgba(100, 200, 255, .2);
        }
        .header p {
            color: #8888aa;
            font-size: 14px;
        }

        /* ===== کارت‌ها ===== */
        .card {
            background: rgba(255, 255, 255, .03);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px 20px;
            margin: 15px 0;
            border: 1px solid rgba(100, 200, 255, .06);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
            transition: .3s;
        }
        .card:hover {
            border-color: rgba(100, 200, 255, .12);
            transform: translateY(-2px);
        }

        /* ===== پیام‌های مخفی ===== */
        .secret-item {
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            padding: 14px 0;
            cursor: pointer;
            transition: .3s;
        }
        .secret-item:last-child {
            border-bottom: none;
        }
        .secret-item:hover {
            background: rgba(100, 200, 255, .03);
            padding-right: 10px;
            border-radius: 12px;
        }

        .secret-title {
            color: #ddddee;
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .secret-title .emoji {
            font-size: 24px;
        }
        .secret-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            margin-right: 6px;
        }
        .secret-badge.message {
            background: rgba(255, 107, 157, .15);
            color: #ff6b9d;
        }
        .secret-badge.memory {
            background: rgba(100, 200, 255, .15);
            color: #64c8ff;
        }
        .secret-badge.surprise {
            background: rgba(255, 215, 0, .15);
            color: #ffd700;
        }
        .secret-badge.celebration {
            background: rgba(111, 207, 151, .15);
            color: #6fcf97;
        }
        .secret-badge.game {
            background: rgba(155, 89, 182, .15);
            color: #9b59b6;
        }

        .secret-meta {
            color: #666688;
            font-size: 12px;
            margin: 4px 0;
        }
        .secret-content {
            display: none;
            margin-top: 10px;
            color: #aaaacc;
            line-height: 2;
            padding: 12px 16px;
            background: rgba(255, 255, 255, .02);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, .04);
            font-size: 14px;
        }
        .secret-content.show {
            display: block;
            animation: fadeUp .4s;
        }

        /* ===== فرم جدید ===== */
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            color: #8888aa;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 14px;
            border: 2px solid rgba(100, 200, 255, .08);
            background: rgba(255, 255, 255, .03);
            color: #ddddee;
            font-size: 14px;
            font-family: Vazirmatn, sans-serif;
            transition: .3s;
            outline: none;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #64c8ff;
            box-shadow: 0 0 20px rgba(100, 200, 255, .05);
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .form-group select option {
            background: #1a1a2e;
            color: #ddddee;
        }
        .form-group .input-row {
            display: flex;
            gap: 10px;
        }
        .form-group .input-row input {
            flex: 1;
        }

        /* ===== دکمه‌ها ===== */
        .btn-primary {
            background: linear-gradient(135deg, #64c8ff, #0066cc);
            color: #0a0a1a;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 4px 20px rgba(100, 200, 255, .15);
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(100, 200, 255, .25);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, .05);
            color: #8888aa;
            border: 1px solid rgba(255, 255, 255, .06);
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, .08);
            color: #ddddee;
        }

        .btn-danger {
            background: rgba(255, 68, 68, .1);
            color: #ff4444;
            border: 1px solid rgba(255, 68, 68, .15);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
        }
        .btn-danger:hover {
            background: rgba(255, 68, 68, .2);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .btn-row button {
            flex: 1;
            min-width: 100px;
        }

        /* ===== مودال ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active {
            display: flex;
            animation: modalFade .3s;
        }
        @keyframes modalFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(145deg, #1a1a2e, #0f0f1f);
            border-radius: 28px;
            padding: 32px 28px;
            max-width: 540px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(100, 200, 255, .06);
            animation: modalPop .3s;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-content h3 {
            color: #64c8ff;
            font-size: 22px;
            text-align: center;
            margin-bottom: 4px;
        }
        .modal-content .sub {
            color: #666688;
            font-size: 13px;
            text-align: center;
            margin-bottom: 18px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
            border: none;
        }
        .modal-actions .btn-save {
            background: linear-gradient(135deg, #64c8ff, #0066cc);
            color: #0a0a1a;
        }
        .modal-actions .btn-save:hover {
            transform: scale(1.02);
        }
        .modal-actions .btn-cancel {
            background: rgba(255, 255, 255, .05);
            color: #8888aa;
        }
        .modal-actions .btn-cancel:hover {
            background: rgba(255, 255, 255, .08);
        }

        /* ===== خالی ===== */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #666688;
        }
        .empty-state .empty-icon {
            font-size: 50px;
            display: block;
            margin-bottom: 8px;
        }

        /* ===== دکمه برگشت ===== */
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            color: #8888aa;
            text-decoration: none;
            font-size: 15px;
            border-radius: 30px;
            transition: .3s;
            background: rgba(255, 255, 255, .02);
            border: 1px solid rgba(255, 255, 255, .04);
        }
        .back-link:hover {
            color: #64c8ff;
            border-color: rgba(100, 200, 255, .15);
        }

        /* ===== انیمیشن‌ها ===== */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 480px) {
            .header h1 { font-size: 24px; }
            .header .icon { font-size: 55px; }
            .modal-content { padding: 24px 16px; }
            .form-group .input-row { flex-direction: column; gap: 0; }
            .secret-title { font-size: 15px; }
        }
    </style>
</head>
<body>

    <!-- ===== ستاره‌ها ===== -->
    <div class="stars" id="stars"></div>

    <!-- ===== قلب‌های متحرک ===== -->
    <div class="heart-float" style="left:5%; animation-delay:0s;">💖</div>
    <div class="heart-float" style="left:20%; animation-delay:4s;">🤍</div>
    <div class="heart-float" style="left:40%; animation-delay:8s;">💗</div>
    <div class="heart-float" style="left:60%; animation-delay:2s;">❤️</div>
    <div class="heart-float" style="left:80%; animation-delay:6s;">💕</div>
    <div class="heart-float" style="left:92%; animation-delay:10s;">🌸</div>

    <div class="container">

        <!-- ===== هدر ===== -->
        <div class="header">
            <span class="icon">🔐</span>
            <h1>اتاق مخفی</h1>
            <p>✨ جایی برای رازهای ما ✨</p>
        </div>

        <!-- ===== دکمه جدید ===== -->
        <button class="btn-primary" onclick="openNewSecret()" style="width:100%; margin-bottom:15px;">
            ✍️ پیام مخفی جدید
        </button>

        <!-- ===== فیلتر ===== -->
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:15px;" id="filterButtons">
            <button class="btn-secondary active" data-filter="all" onclick="filterSecrets('all')" style="padding:8px 18px; font-size:13px; flex:1; min-width:60px;">
                همه
            </button>
            <button class="btn-secondary" data-filter="message" onclick="filterSecrets('message')" style="padding:8px 18px; font-size:13px; flex:1; min-width:60px;">
                💌 نامه
            </button>
            <button class="btn-secondary" data-filter="memory" onclick="filterSecrets('memory')" style="padding:8px 18px; font-size:13px; flex:1; min-width:60px;">
                📖 خاطره
            </button>
            <button class="btn-secondary" data-filter="surprise" onclick="filterSecrets('surprise')" style="padding:8px 18px; font-size:13px; flex:1; min-width:60px;">
                🎁 سوپرایز
            </button>
            <button class="btn-secondary" data-filter="celebration" onclick="filterSecrets('celebration')" style="padding:8px 18px; font-size:13px; flex:1; min-width:60px;">
                🎉 تبریک
            </button>
        </div>

        <!-- ===== لیست پیام‌ها ===== -->
        <div id="secretsList">
            <div class="card" style="text-align:center; color:#666688;">
                ⏳ در حال بارگذاری...
            </div>
        </div>

        <!-- ===== دکمه برگشت ===== -->
        <a href="../index.html" class="back-link">⬅ برگشت به خانه</a>

    </div>

    <!-- =============================================
    مودال پیام جدید
    ============================================= -->
    <div class="modal" id="newSecretModal">
        <div class="modal-content">
            <h3>🔐 پیام مخفی جدید</h3>
            <p class="sub">این پیام فقط تو اینجا دیده میشه...</p>

            <div class="form-group">
                <label>📝 عنوان</label>
                <input type="text" id="secretTitle" placeholder="عنوان پیام..." />
            </div>

            <div class="form-group">
                <label>📂 نوع</label>
                <select id="secretType">
                    <option value="message">💌 نامه</option>
                    <option value="memory">📖 خاطره</option>
                    <option value="surprise">🎁 سوپرایز</option>
                    <option value="celebration">🎉 تبریک</option>
                </select>
            </div>

            <div class="form-group">
                <label>📝 متن پیام</label>
                <textarea id="secretContent" placeholder="متن پیام مخفی..."></textarea>
            </div>

            <div class="form-group">
                <label>🔑 کد دسترسی (اختیاری)</label>
                <input type="text" id="secretCode" placeholder="کد ۴ رقمی..." maxlength="4" />
                <div style="color:#666688; font-size:11px; margin-top:4px;">
                    ⚠️ اگر کد بذاری، فقط با وارد کردن اون میشه پیام رو دید
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeNewSecret()">بی‌خیال</button>
                <button class="btn-save" onclick="saveSecret()">💾 ذخیره</button>
            </div>
        </div>
    </div>

    <!-- =============================================
    مودال کد دسترسی
    ============================================= -->
    <div class="modal" id="codeModal">
        <div class="modal-content" style="max-width:380px;">
            <h3>🔑 کد دسترسی</h3>
            <p class="sub">برای دیدن این پیام، کد رو وارد کن</p>
            <div class="form-group">
                <input type="password" id="codeInput" placeholder="کد ۴ رقمی..." maxlength="4" 
                       style="text-align:center; font-size:28px; letter-spacing:8px; direction:ltr;" />
            </div>
            <div id="codeError" style="color:#ff4444; font-size:13px; text-align:center; min-height:24px;"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeCodeModal()">بی‌خیال</button>
                <button class="btn-save" onclick="checkCode()">🔓 باز کردن</button>
            </div>
        </div>
    </div>

    <!-- =============================================
    مودال جزئیات
    ============================================= -->
    <div class="modal" id="detailModal">
        <div class="modal-content" id="detailContent">
            <!-- با جاوااسکریپت پر میشه -->
        </div>
    </div>

    <script>
        // =============================================
        // ===== تنظیمات =====
        // =============================================
        const SUPABASE_URL = window.CONFIG?.SUPABASE_URL ||
            'https://zcossaztlqzznmhxuphx.supabase.co';
        const SUPABASE_KEY = window.CONFIG?.SUPABASE_KEY ||
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpjb3NzYXp0bHF6em5taHh1cGh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDI4MDMsImV4cCI6MjEwMTY3ODgwM30.ahdN6aNQyyn2_5Q7PtUZD3yYl_xcncJ0GUSr0UetUJQ';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allSecrets = [];
        let currentFilter = 'all';
        let pendingSecretId = null;

        // =============================================
        // ===== ستاره‌ها =====
        // =============================================
        function createStars() {
            const container = document.getElementById('stars');
            const emojis = ['✦', '✧', '⋆', '✶', '✵', '❋'];
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                star.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = (Math.random() * 5) + 's';
                star.style.animationDuration = (2 + Math.random() * 4) + 's';
                star.style.fontSize = (8 + Math.random() * 14) + 'px';
                container.appendChild(star);
            }
        }
        createStars();

        // =============================================
        // ===== بارگذاری پیام‌ها =====
        // =============================================
        async function loadSecrets() {
            try {
                const { data, error } = await supabase
                    .from('messages')
                    .select('*')
                    .eq('is_deleted', false)
                    .order('date', { ascending: false });

                if (error) throw error;

                allSecrets = data || [];
                renderSecrets();

            } catch (error) {
                console.error('❌ خطا:', error);
                document.getElementById('secretsList').innerHTML = `
                    <div class="card" style="text-align:center; color:#ff4444;">
                        ❌ خطا در بارگذاری: ${error.message}
                    </div>
                `;
            }
        }

        // =============================================
        // ===== رندر پیام‌ها =====
        // =============================================
        function renderSecrets() {
            const container = document.getElementById('secretsList');

            const filtered = currentFilter === 'all' ?
                allSecrets :
                allSecrets.filter(s => s.type === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="card empty-state">
                        <span class="empty-icon">🔮</span>
                        <p>هیچ پیام مخفی‌ای نیست...</p>
                        <p style="font-size:13px; color:#555577;">اولین پیام رو بنویس!</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(item => {
                const typeLabels = {
                    'message': '💌 نامه',
                    'memory': '📖 خاطره',
                    'surprise': '🎁 سوپرایز',
                    'celebration': '🎉 تبریک',
                    'game': '🧠 بازی'
                };
                const typeLabel = typeLabels[item.type] || '📝 پیام';
                const typeClass = item.type || 'message';
                const date = item.date ? new Date(item.date).toLocaleDateString('fa-IR') : '';
                const hasCode = item.secret_code && item.secret_code.length > 0;

                html += `
                    <div class="card secret-item" onclick="openSecretDetail('${item.id}')">
                        <div class="secret-title">
                            <span class="emoji">${getEmojiForType(item.type)}</span>
                            ${item.title || 'بی‌عنوان'}
                            <span class="secret-badge ${typeClass}">${typeLabel}</span>
                            ${hasCode ? '🔒' : ''}
                        </div>
                        <div class="secret-meta">
                            📅 ${date}
                            ${item.sender ? ` | ✉️ از: ${item.sender}` : ''}
                            ${item.chapter ? ` | 📂 ${item.chapter}` : ''}
                        </div>
                        <div class="secret-content" id="secret-${item.id}">
                            ${item.content || '✨'}
                            ${item.gift ? `<br><br>🎁 هدیه: ${item.gift}` : ''}
                            ${item.images ? `<br><br>🖼️ <span style="color:#666688;">عکس‌ها: ${item.images}</span>` : ''}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // =============================================
        // ===== ایموجی بر اساس نوع =====
        // =============================================
        function getEmojiForType(type) {
            const map = {
                'message': '💌',
                'memory': '📖',
                'surprise': '🎁',
                'celebration': '🎉',
                'game': '🧠',
                'secret': '🔐'
            };
            return map[type] || '📝';
        }

        // =============================================
        // ===== فیلتر =====
        // =============================================
        function filterSecrets(filter) {
            currentFilter = filter;
            renderSecrets();

            document.querySelectorAll('#filterButtons .btn-secondary').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
        }

        // =============================================
        // ===== باز کردن جزئیات =====
        // =============================================
        async function openSecretDetail(id) {
            try {
                const item = allSecrets.find(s => s.id === id);
                if (!item) return;

                // اگر کد داشت، مودال کد رو نشون بده
                if (item.secret_code && item.secret_code.length > 0) {
                    pendingSecretId = id;
                    document.getElementById('codeModal').classList.add('active');
                    document.getElementById('codeInput').value = '';
                    document.getElementById('codeError').textContent = '';
                    document.body.style.overflow = 'hidden';
                    return;
                }

                showDetail(item);

            } catch (error) {
                console.error('❌ خطا:', error);
            }
        }

        // =============================================
        // ===== بررسی کد =====
        // =============================================
        function checkCode() {
            const input = document.getElementById('codeInput');
            const error = document.getElementById('codeError');
            const code = input.value.trim();

            if (!code) {
                error.textContent = '⚠️ لطفاً کد رو وارد کن';
                return;
            }

            const item = allSecrets.find(s => s.id === pendingSecretId);
            if (!item) {
                error.textContent = '❌ پیام پیدا نشد';
                return;
            }

            if (code === item.secret_code) {
                closeCodeModal();
                showDetail(item);
            } else {
                error.textContent = '❌ کد اشتباه است!';
                input.value = '';
                input.focus();
            }
        }

        function closeCodeModal() {
            document.getElementById('codeModal').classList.remove('active');
            document.body.style.overflow = '';
            pendingSecretId = null;
        }

        // =============================================
        // ===== نمایش جزئیات =====
        // =============================================
        function showDetail(item) {
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('detailContent');

            const typeLabels = {
                'message': '💌 نامه',
                'memory': '📖 خاطره',
                'surprise': '🎁 سوپرایز',
                'celebration': '🎉 تبریک',
                'game': '🧠 بازی'
            };
            const typeLabel = typeLabels[item.type] || '📝 پیام';
            const date = item.date ? new Date(item.date).toLocaleDateString('fa-IR') : '';

            content.innerHTML = `
                <div style="text-align:center; margin-bottom:14px;">
                    <span style="font-size:50px; display:block;">${getEmojiForType(item.type)}</span>
                    <h3 style="color:#64c8ff; font-size:22px; margin:4px 0;">${item.title || 'بی‌عنوان'}</h3>
                    <span class="secret-badge ${item.type || 'message'}">${typeLabel}</span>
                </div>

                <div style="background:rgba(100,200,255,.04); border-radius:16px; padding:16px; margin:10px 0; border-right:3px solid #64c8ff;">
                    <p style="color:#ccccee; line-height:2.2; font-size:15px;">${item.content || '✨'}</p>
                </div>

                ${item.sender ? `
                    <div style="color:#8888aa; font-size:13px; margin:4px 0;">
                        ✉️ از: ${item.sender}
                    </div>
                ` : ''}

                ${item.receiver ? `
                    <div style="color:#8888aa; font-size:13px; margin:4px 0;">
                        📩 به: ${item.receiver}
                    </div>
                ` : ''}

                ${item.chapter ? `
                    <div style="color:#8888aa; font-size:13px; margin:4px 0;">
                        📂 فصل: ${item.chapter}
                    </div>
                ` : ''}

                ${item.start_date || item.end_date ? `
                    <div style="color:#8888aa; font-size:13px; margin:4px 0;">
                        📅 ${item.start_date ? `از: ${new Date(item.start_date).toLocaleDateString('fa-IR')}` : ''}
                        ${item.end_date ? ` تا: ${new Date(item.end_date).toLocaleDateString('fa-IR')}` : ''}
                    </div>
                ` : ''}

                ${item.gift ? `
                    <div style="background:rgba(255,215,0,.06); border-radius:12px; padding:10px 14px; margin:8px 0; border:1px solid rgba(255,215,0,.08);">
                        🎁 <strong style="color:#ffd700;">هدیه:</strong> ${item.gift}
                    </div>
                ` : ''}

                ${item.images ? `
                    <div style="color:#8888aa; font-size:13px; margin:6px 0;">
                        🖼️ عکس‌ها: ${item.images}
                    </div>
                ` : ''}

                ${date ? `
                    <div style="color:#666688; font-size:12px; margin-top:8px;">
                        📅 ${date}
                    </div>
                ` : ''}

                <div style="display:flex; gap:10px; margin-top:18px;">
                    <button onclick="deleteSecret('${item.id}')" 
                            class="btn-danger" 
                            style="flex:1; padding:12px; border-radius:14px; font-size:14px;">
                        🗑️ حذف
                    </button>
                    <button onclick="closeDetailModal()" 
                            class="btn-secondary" 
                            style="flex:1; padding:12px; border-radius:14px; font-size:14px;">
                        بستن ❤️
                    </button>
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // =============================================
        // ===== حذف =====
        // =============================================
        async function deleteSecret(id) {
            if (!confirm('⚠️ مطمئنی میخوای این پیام رو حذف کنی؟')) return;

            try {
                const { error } = await supabase
                    .from('messages')
                    .update({ is_deleted: true })
                    .eq('id', id);

                if (error) throw error;

                closeDetailModal();
                await loadSecrets();
                showToast('🗑️ پیام حذف شد');

            } catch (error) {
                console.error('❌ خطا:', error);
                alert('❌ خطا در حذف');
            }
        }

        // =============================================
        // ===== مودال جدید =====
        // =============================================
        function openNewSecret() {
            document.getElementById('newSecretModal').classList.add('active');
            document.body.style.overflow = 'hidden';

            document.getElementById('secretTitle').value = '';
            document.getElementById('secretContent').value = '';
            document.getElementById('secretCode').value = '';
            document.getElementById('secretType').value = 'message';
        }

        function closeNewSecret() {
            document.getElementById('newSecretModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // =============================================
        // ===== ذخیره پیام =====
        // =============================================
        async function saveSecret() {
            const title = document.getElementById('secretTitle').value.trim();
            const type = document.getElementById('secretType').value;
            const content = document.getElementById('secretContent').value.trim();
            const code = document.getElementById('secretCode').value.trim();

            if (!content) {
                alert('⚠️ لطفاً متن پیام رو بنویس!');
                return;
            }

            try {
                const { error } = await supabase
                    .from('messages')
                    .insert([{
                        type: type,
                        title: title || 'بی‌عنوان',
                        content: content,
                        date: new Date().toISOString(),
                        is_deleted: false,
                        secret_code: code || null
                    }]);

                if (error) throw error;

                closeNewSecret();
                await loadSecrets();
                showToast('🔐 پیام مخفی با موفقیت ذخیره شد!');

            } catch (error) {
                console.error('❌ خطا:', error);
                alert('❌ خطا در ذخیره: ' + error.message);
            }
        }

        // =============================================
        // ===== نوتیفیکیشن =====
        // =============================================
        function showToast(message) {
            const existing = document.querySelector('.toast-msg');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(100,200,255,.92);
                backdrop-filter: blur(12px);
                color: #0a0a1a;
                padding: 14px 28px;
                border-radius: 20px;
                font-size: 15px;
                font-weight: 700;
                z-index: 99999;
                animation: fadeUp .4s;
                box-shadow: 0 8px 30px rgba(100,200,255,.2);
                max-width: 90%;
                text-align: center;
                font-family: Vazirmatn, sans-serif;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity .5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // =============================================
        // ===== کلیک بیرون مودال =====
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('newSecretModal').addEventListener('click', function(e) {
                if (e.target === this) closeNewSecret();
            });
            document.getElementById('detailModal').addEventListener('click', function(e) {
                if (e.target === this) closeDetailModal();
            });
            document.getElementById('codeModal').addEventListener('click', function(e) {
                if (e.target === this) closeCodeModal();
            });

            // Enter برای کد
            document.getElementById('codeInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') checkCode();
            });

            loadSecrets();
        });
    </script>

</body>
</html>
