<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دنیای پریسا 🤍</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
*{box-sizing:border-box;font-family:Vazirmatn,sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#ffd6e7,#fff7fb);display:flex;justify-content:center;align-items:center;overflow:hidden}
.heart{position:absolute;opacity:.35;animation:f 10s linear infinite}.heart:nth-child(1){left:10%}.heart:nth-child(2){left:30%;animation-delay:2s}.heart:nth-child(3){left:70%;animation-delay:5s}.heart:nth-child(4){left:90%;animation-delay:1s}
@keyframes f{from{transform:translateY(100vh)}to{transform:translateY(-20vh)}}
.container{width:92%;max-width:520px;text-align:center}
.logo{font-size:72px}.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(12px);padding:18px;border-radius:24px;box-shadow:0 10px 25px rgba(0,0,0,.08);margin:18px 0}
button{border:none;background:#b03060;color:#fff;padding:15px 30px;border-radius:30px;font-size:18px;cursor:pointer}
.menu{display:none}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{text-decoration:none;color:#444;background:rgba(255,255,255,.55);padding:20px;border-radius:22px}
.card span{display:block;margin-top:8px;font-size:14px}
#counter{line-height:2;color:#b03060}
</style></head>
<body>
<div class="heart">🤍</div><div class="heart">♡</div><div class="heart">🤍</div><div class="heart">♡</div>
<div class="container">
<div id="welcome">
<div class="logo">🤍</div>
<h2>سلام پریسا...</h2>
<p>این فقط یک سایت نیست؛ یه دنیای کوچیکه که با فکر تو ساخته شده ✨</p>
<div class="glass">
<div id="counter">در حال محاسبه...</div>
</div>
<button onclick="enter()">ورود به دنیای ما 🤍</button>
</div>
<div class="menu" id="menu">
<h2>دنیای پریسا ✨</h2>
<div class="cards">
<a class="card" href="#">💌<span>نامه‌ها</span></a>
<a class="card" href="surprises/surprises.html">🎁<span>سوپرایزها</span></a>
<a class="card" href="#">📸<span>خاطرات</span></a>
<a class="card" href="#">🧠<span>بازی و تست‌ها</span></a>
<a class="card" href="celebrations/celebrations.html">🎉<span>تبریکات</span></a>
<a class="card" href="#">🔒<span>اتاق مخفی</span></a>
</div>
</div>
</div>
<script>
function enter(){welcome.style.display='none';menu.style.display='block';}
const start=new Date("2023-03-06T23:00:00");
function u(){
 let d=Date.now()-start.getTime();
 let days=Math.floor(d/86400000);d%=86400000;
 let h=Math.floor(d/3600000);d%=3600000;
 let m=Math.floor(d/60000);d%=60000;
 let s=Math.floor(d/1000);
 counter.innerHTML=`<b>⏳ از شبی که سرنوشت اسم تو را وارد زندگی من کرد...</b><br><span style="font-size:32px">❤️ ${days} روز</span><br>🕒 ${h} ساعت &nbsp; ⏰ ${m} دقیقه &nbsp; ✨ ${s} ثانیه<br>میگذره<br><br>📅 ۱۵ اسفند ۱۴۰۱ - ساعت ۲۳:۰۰<br><i>و هنوز داستان ما ادامه داره... 🤍</i>`;
}
u();setInterval(u,1000);
</script></body></html>
