<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 اتاق ماجراجویی مخفی</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    
    <!-- ===== بارگذاری config.js (کلید Resend) ===== -->
    <script src="../config.js"></script>

    <style>
        /* ===== تمام استایل‌های قبلی شما ===== */
        /* (از فایل قبلی کپی کنید) */
        /* ... */
    </style>
</head>
<body>

    <!-- ===== تمام HTML قبلی شما ===== -->
    <!-- (همه چیز مثل قبل) -->

    <script>
        // =============================================
        // ===== تنظیمات Supabase =====
        // =============================================
        const SUPABASE_URL = 'https://zcossaztlqzznmhxuphx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpjb3NzYXp0bHF6em5taHh1cGh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDI4MDMsImV4cCI6MjEwMTY3ODgwM30.ahdN6aNQyyn2_5Q7PtUZD3yYl_xcncJ0GUSr0UetUJQ';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        console.log('✅ Supabase متصل شد!');

        // =============================================
        // ===== تنظیمات Resend (از config.js) =====
        // =============================================
        const RESEND_API_KEY = window.CONFIG?.RESEND_API_KEY || '';
        const RESEND_FROM_EMAIL = 'onboarding@resend.dev';

        if (!RESEND_API_KEY) {
            console.warn('⚠️ RESEND_API_KEY در config.js تنظیم نشده! ایمیل ارسال نمیشه.');
        } else {
            console.log('✅ Resend API Key پیدا شد!');
        }

        // =============================================
        // ===== تابع ارسال ایمیل مخفی =====
        // =============================================
        async function sendEmailWithResend(to, subject, type = 'self_destruct') {
            if (!RESEND_API_KEY) {
                console.warn('⚠️ کلید Resend وجود ندارد!');
                return false;
            }

            try {
                const emojis = {
                    'self_destruct': '💣',
                    'message': '💌',
                    'memory': '📖',
                    'secret': '🤫',
                    'crazy': '🔥'
                };
                
                const colors = {
                    'self_destruct': '#ff4444',
                    'message': '#ff6b9d',
                    'memory': '#7a4dff',
                    'secret': '#ffb347',
                    'crazy': '#ff6b00'
                };
                
                const emoji = emojis[type] || '💕';
                const color = colors[type] || '#b03060';
                
                const siteUrl = window.location.origin + '/secret/index.html?view=true';

                const htmlContent = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    </head>
                    <body style="font-family: 'Vazirmatn', Tahoma, sans-serif; direction: rtl; background: linear-gradient(135deg, #f5f0ff, #fff5f7); padding: 40px 20px; margin: 0;">
                        <div style="max-width: 580px; margin: 0 auto; background: white; border-radius: 28px; padding: 40px 35px; box-shadow: 0 20px 60px rgba(0,0,0,0.08);">
                            
                            <div style="text-align: center; margin-bottom: 25px;">
                                <div style="font-size: 52px; display: block; margin-bottom: 8px;">${emoji}</div>
                                <h2 style="color: ${color}; font-size: 24px; margin: 0; font-weight: 700;">${subject}</h2>
                                <div style="width: 60px; height: 3px; background: ${color}; margin: 12px auto; border-radius: 4px;"></div>
                            </div>
                            
                            <div style="background: #faf5ff; border-radius: 18px; padding: 24px 28px; margin: 15px 0; border-right: 4px solid ${color}; text-align: center;">
                                <p style="color: #666; font-size: 18px; margin: 0;">
                                    🔒 یک پیام <strong>محرمانه</strong> جدید داری!
                                </p>
                                <p style="color: #999; font-size: 14px; margin: 8px 0 0 0;">
                                    برای مشاهده، روی دکمه زیر کلیک کن
                                </p>
                            </div>
                            
                            <div style="text-align: center; margin: 25px 0 15px;">
                                <a href="${siteUrl}" 
                                   style="display: inline-block; background: ${color}; color: white; padding: 14px 40px; border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 16px; box-shadow: 0 4px 15px ${color}40;">
                                    🔓 مشاهده در اتاق مخفی
                                </a>
                            </div>
                            
                            <div style="text-align: center; color: #999; font-size: 12px; margin-top: 25px; padding-top: 20px; border-top: 1px solid #f0e8f5;">
                                <p style="margin: 0 0 5px 0;">✨ این پیام از <strong style="color: ${color};">دنیای پریسا</strong> ارسال شده</p>
                                <p style="margin: 0; opacity: 0.6;">🔮 اتاق ماجراجویی مخفی</p>
                                <p style="margin: 8px 0 0 0; opacity: 0.4; font-size: 10px;">
                                    ⚠️ متن پیام در ایمیل نمایش داده نمیشه
                                </p>
                            </div>
                            
                        </div>
                    </body>
                    </html>
                `;

                const response = await fetch('https://api.resend.com/emails', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${RESEND_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        from: RESEND_FROM_EMAIL,
                        to: [to],
                        subject: subject,
                        html: htmlContent
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'خطا در ارسال ایمیل');
                }

                console.log('✅ ایمیل مخفی به', to, 'ارسال شد!');
                return true;
            } catch (error) {
                console.error('❌ خطا در ارسال ایمیل:', error);
                return false;
            }
        }

        // =============================================
        // ===== (بقیه کدهای شما) =====
        // =============================================
        // ... همه کدهای قبلی شما اینجا ...
        // (dbClient, توابع کمکی, پیام‌ها, خاطرات, و...)
    </script>
</body>
</html>
