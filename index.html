<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دنیای پریسا 🤍</title>

    <!-- فونت وزیرمتن -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');

        /* ============================================
                   تنظیمات پایه
                   ============================================ */
        * {
            box-sizing: border-box;
            font-family: Vazirmatn, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffd6e7, #fff7fb);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* ============================================
                   قلب‌های متحرک پس‌زمینه
                   ============================================ */
        .heart {
            position: absolute;
            opacity: .35;
            animation: floatHeart 10s linear infinite;
        }

        .heart:nth-child(1) {
            left: 10%;
        }
        .heart:nth-child(2) {
            left: 30%;
            animation-delay: 2s;
        }
        .heart:nth-child(3) {
            left: 70%;
            animation-delay: 5s;
        }
        .heart:nth-child(4) {
            left: 90%;
            animation-delay: 1s;
        }

        @keyframes floatHeart {
            from {
                transform: translateY(100vh);
            }
            to {
                transform: translateY(-20vh);
            }
        }

        /* ============================================
                   کانتینر اصلی
                   ============================================ */
        .container {
            width: 92%;
            max-width: 520px;
            text-align: center;
        }

        /* ============================================
                   لوگو
                   ============================================ */
        .logo {
            font-size: 72px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.15);
            }
        }

        /* ============================================
                   کارت شیشه‌ای (برای شمارشگر)
                   ============================================ */
        .glass {
            background: rgba(255, 255, 255, .55);
            backdrop-filter: blur(12px);
            padding: 18px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
            margin: 18px 0;
        }

        /* ============================================
                   دکمه
                   ============================================ */
        button {
            border: none;
            background: #b03060;
            color: #fff;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(176, 48, 96, .4);
        }

        /* ============================================
                   صفحه خوش‌آمدگویی
                   ============================================ */
        .welcome {
            animation: show 1.5s;
        }

        .welcome h2 {
            color: #b03060;
            font-size: 28px;
        }

        .welcome p {
            color: #555;
            line-height: 2;
        }

        /* ============================================
                   منوی اصلی
                   ============================================ */
        .menu {
            display: none;
            animation: show 1s;
        }

        .menu h1 {
            color: #b03060;
            font-size: 30px;
        }

        .menu p {
            color: #555;
            line-height: 2;
        }

        /* ============================================
                   کارت‌های منو
                   ============================================ */
        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .card {
            text-decoration: none;
            color: #444;
            background: rgba(255, 255, 255, .55);
            padding: 25px 10px;
            border-radius: 22px;
            font-size: 35px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 35px rgba(0, 0, 0, .15);
        }

        .card span {
            display: block;
            margin-top: 8px;
            font-size: 14px;
        }

        /* ============================================
                   شمارشگر زمان
                   ============================================ */
        #counter {
            line-height: 2;
            color: #b03060;
        }

        /* ============================================
                   فوتر
                   ============================================ */
        footer {
            margin-top: 35px;
            color: #888;
        }

        /* ============================================
                   انیمیشن‌ها
                   ============================================ */
        @keyframes show {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- ==========================================
    قلب‌های متحرک پس‌زمینه
    ========================================== -->
    <div class="heart">🤍</div>
    <div class="heart">♡</div>
    <div class="heart">🤍</div>
    <div class="heart">♡</div>

    <!-- ==========================================
    کانتینر اصلی
    ========================================== -->
    <div class="container">

        <!-- ==========================================
        صفحه خوش‌آمدگویی (قسمت اول)
        ========================================== -->
        <div class="welcome" id="welcome">

            <div class="logo">🤍</div>

            <h2>سلام پریسا...</h2>

            <p>
                این فقط یک سایت نیست؛
                <br>
                یه ایده کوچیکه که با فکر تو ساخته شده ✨
            </p>

            <!-- کارت شیشه‌ای شمارشگر (دست نخورده) -->
            <div class="glass">
                <div id="counter">در حال محاسبه...</div>
            </div>

            <button onclick="enter()">ورود به دنیای ما 🤍</button>

        </div>

        <!-- ==========================================
        منوی اصلی (قسمت دوم)
        ========================================== -->
        <div class="menu" id="menu">

            <h1>دنیای پریسا ✨</h1>

            <p>هر قسمت یه داستان کوچیک داره...</p>

            <div class="cards">

                <a class="card" href="#">
                    💌
                    <span>نامه‌ها</span>
                </a>

                <a class="card" href="surprises/surprises.html">
                    🎁
                    <span>سوپرایزها</span>
                </a>

                <a class="card" href="#">
                    📸
                    <span>خاطرات</span>
                </a>

                <a class="card" href="game and test/game and test.html">
                    🧠
                    <span>بازی و تست‌ها</span>
                </a>

                <a class="card" href="celebrations/celebrations.html">
                    🎉
                    <span>تبریکات</span>
                </a>

                <a class="card" href="secret/index.html">
                    🔒
                    <span>اتاق مخفی</span>
                </a>

            </div>

            <footer>ساخته شده با عشق 🤍</footer>

        </div>

    </div>

    <!-- ==========================================
    اسکریپت‌ها
    ========================================== -->
    <script>

        // ----- تابع نمایش منو -----
        function enter() {
            document.getElementById("welcome").style.display = "none";
            document.getElementById("menu").style.display = "block";
        }

        // ----- شمارشگر زمان (دست نخورده) -----
        const start = new Date("2023-03-06T23:00:00");

        function updateCounter() {
            let diff = Date.now() - start.getTime();

            let days = Math.floor(diff / 86400000);
            diff %= 86400000;

            let hours = Math.floor(diff / 3600000);
            diff %= 3600000;

            let minutes = Math.floor(diff / 60000);
            diff %= 60000;

            let seconds = Math.floor(diff / 1000);

            document.getElementById("counter").innerHTML =
                `<b>⏳ از شبی که سرنوشت اسم تو را وارد زندگی من کرد...</b>
                 <br>
                 <span style="font-size:32px">❤️ ${days} روز</span>
                 <br>
                 🕒 ${hours} ساعت &nbsp; ⏰ ${minutes} دقیقه &nbsp; ✨ ${seconds} ثانیه
                 <br>
                 میگذره
                 <br><br>
                 📅 ۱۵ اسفند ۱۴۰۱ - ساعت ۲۳:۰۰
                 <br>
                 <i>و هنوز داستان ما ادامه داره... 🤍</i>`;
        }

        // اجرای اولیه و تیک‌زنی هر ثانیه
        updateCounter();
        setInterval(updateCounter, 1000);

    </script>

</body>

</html>
