<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>دنیای پریسا 🤍</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    
    <!-- ===== بارگذاری config.js (کلید Resend) ===== -->
    <script src="config.js"></script>
    
    <style>
        /* ===== تمام استایل‌های قبلی شما ===== */
        /* (من برای اختصار نمی‌نویسم، ولی شما از فایل قبلی کپی کنید) */
        /* ... */
    </style>
</head>
<body>

    <!-- ===== تمام HTML قبلی شما ===== -->
    <!-- (همه چیز مثل قبل) -->

    <script>
        // =============================================
        // ===== تنظیمات Supabase =====
        // =============================================
        const SUPABASE_URL = 'https://zcossaztlqzznmhxuphx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpjb3NzYXp0bHF6em5taHh1cGh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDI4MDMsImV4cCI6MjEwMTY3ODgwM30.ahdN6aNQyyn2_5Q7PtUZD3yYl_xcncJ0GUSr0UetUJQ';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        console.log('✅ Supabase متصل شد!');

        // =============================================
        // ===== تنظیمات Resend (از config.js) =====
        // =============================================
        const RESEND_API_KEY = window.CONFIG?.RESEND_API_KEY || '';
        const RESEND_FROM_EMAIL = 'onboarding@resend.dev';

        if (!RESEND_API_KEY) {
            console.warn('⚠️ RESEND_API_KEY در config.js تنظیم نشده! ایمیل ارسال نمیشه.');
        } else {
            console.log('✅ Resend API Key پیدا شد!');
        }

        // =============================================
        // ===== تابع ارسال ایمیل =====
        // =============================================
        async function sendEmailWithResend(to, subject, htmlContent) {
            if (!RESEND_API_KEY) {
                console.warn('⚠️ کلید Resend وجود ندارد!');
                return false;
            }
            
            if (!to || !subject || !htmlContent) {
                console.warn('⚠️ اطلاعات ایمیل کامل نیست!');
                return false;
            }

            try {
                const response = await fetch('https://api.resend.com/emails', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${RESEND_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        from: RESEND_FROM_EMAIL,
                        to: [to],
                        subject: subject,
                        html: htmlContent
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'خطا در ارسال ایمیل');
                }

                console.log('✅ ایمیل به', to, 'ارسال شد!');
                return true;
            } catch (error) {
                console.error('❌ خطا در ارسال ایمیل:', error);
                return false;
            }
        }

        // =============================================
        // ===== ساخت قالب ایمیل =====
        // =============================================
        function buildEmailTemplate(subject, message, type = 'reminder') {
            const colors = {
                'reminder': '#27ae60',
                'self_destruct': '#ff4444',
                'message': '#ff6b9d',
                'memory': '#7a4dff',
                'secret': '#ffb347',
                'crazy': '#ff6b00'
            };
            
            const emojis = {
                'reminder': '🌸',
                'self_destruct': '💣',
                'message': '💌',
                'memory': '📖',
                'secret': '🤫',
                'crazy': '🔥'
            };
            
            const color = colors[type] || '#b03060';
            const emoji = emojis[type] || '💕';
            
            return `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                </head>
                <body style="font-family: 'Vazirmatn', Tahoma, sans-serif; direction: rtl; background: linear-gradient(135deg, #f5f0ff, #fff5f7); padding: 40px 20px; margin: 0;">
                    <div style="max-width: 580px; margin: 0 auto; background: white; border-radius: 28px; padding: 40px 35px; box-shadow: 0 20px 60px rgba(0,0,0,0.08);">
                        
                        <div style="text-align: center; margin-bottom: 25px;">
                            <div style="font-size: 52px; display: block; margin-bottom: 8px;">${emoji}</div>
                            <h2 style="color: ${color}; font-size: 24px; margin: 0; font-weight: 700;">${subject}</h2>
                            <div style="width: 60px; height: 3px; background: ${color}; margin: 12px auto; border-radius: 4px;"></div>
                        </div>
                        
                        <div style="background: #faf5ff; border-radius: 18px; padding: 24px 28px; margin: 15px 0; border-right: 4px solid ${color};">
                            <p style="color: #333; line-height: 2.2; font-size: 16px; margin: 0; white-space: pre-line;">
                                ${message}
                            </p>
                        </div>
                        
                        <div style="text-align: center; color: #999; font-size: 12px; margin-top: 25px; padding-top: 20px; border-top: 1px solid #f0e8f5;">
                            <p style="margin: 0 0 5px 0;">✨ این پیام از <strong style="color: ${color};">دنیای پریسا</strong> ارسال شده</p>
                            <p style="margin: 0; opacity: 0.6;">🌙 روزهای خاص</p>
                        </div>
                        
                    </div>
                </body>
                </html>
            `;
        }

        // =============================================
        // ===== سیستم یادآوری پریود =====
        // =============================================
        async function checkPeriodReminder() {
            try {
                const data = await dbClient.getPeriods();
                const history = data.map(item => item.period_date);
                
                if (history.length === 0) return;
                
                const cycleLength = calculateAverageCycle(history) || DEFAULT_CYCLE;
                const { cycleDay, daysUntil } = getCycleDayAndDaysUntil(history, cycleLength);
                
                if (daysUntil === 2) {
                    const emails = await dbClient.getEmails();
                    if (emails && (emails.prisa_email || emails.partner_email)) {
                        const subject = '🌸 یادآوری: ۲ روز تا پریود';
                        const message = `
                            سلام عزیزم! 💕
                            
                            فقط ۲ روز مونده به روزهای خاص...
                            آماده باش که هوای خودت رو داشته باشی 🌸
                            
                            💪 قوی باش، کنارتم!
                            
                            📅 تاریخ امروز: ${new Date().toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' })}
                        `;
                        
                        const htmlContent = buildEmailTemplate(subject, message, 'reminder');
                        
                        if (emails.prisa_email) {
                            await sendEmailWithResend(emails.prisa_email, subject, htmlContent);
                        }
                        if (emails.partner_email) {
                            await sendEmailWithResend(emails.partner_email, subject, htmlContent);
                        }
                    }
                }
            } catch (error) {
                console.error('❌ خطا در سیستم یادآوری:', error);
            }
        }

        // ===== اجرای دوره‌ای =====
        setInterval(checkPeriodReminder, 6 * 60 * 60 * 1000);
        setTimeout(checkPeriodReminder, 5000);

        // =============================================
        // ===== (بقیه کدهای شما) =====
        // =============================================
        // ... همه کدهای قبلی شما اینجا ...
        // (dbClient, تبدیلات تاریخ, شمارشگر, سیستم رمز, و...)
        
        console.log('✅ همه چیز آماده است!');
        console.log('📧 سیستم ارسال ایمیل با Resend فعال شد!');
    </script>
</body>
</html>
